<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0E0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D3D3D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9A9A9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1219;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3561;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDB813;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FD8D13;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="400" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="650" cy="80" r="45" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="650" cy="80" r="42" fill="#FFD700" opacity="0.3"/>

  <!-- Building/House -->
  <rect x="100" y="300" width="600" height="300" fill="url(#buildingGrad)" stroke="#888888" stroke-width="2"/>

  <!-- Building shadow/depth -->
  <polygon points="700,300 750,350 750,600 700,600" fill="#999999" opacity="0.6"/>
  <polygon points="100,300 50,350 50,600 100,600" fill="#777777" opacity="0.4"/>

  <!-- Windows -->
  <g stroke="#666" stroke-width="2" fill="#E8F4F8" opacity="0.6">
    <!-- Top row of windows -->
    <rect x="150" y="340" width="60" height="50" rx="2"/>
    <line x1="180" y1="340" x2="180" y2="390"/>
    <line x1="150" y1="365" x2="210" y2="365"/>

    <rect x="280" y="340" width="60" height="50" rx="2"/>
    <line x1="310" y1="340" x2="310" y2="390"/>
    <line x1="280" y1="365" x2="340" y2="365"/>

    <rect x="410" y="340" width="60" height="50" rx="2"/>
    <line x1="440" y1="340" x2="440" y2="390"/>
    <line x1="410" y1="365" x2="470" y2="365"/>

    <rect x="540" y="340" width="60" height="50" rx="2"/>
    <line x1="570" y1="340" x2="570" y2="390"/>
    <line x1="540" y1="365" x2="600" y2="365"/>
  </g>

  <!-- Balcony/Railing -->
  <rect x="80" y="420" width="640" height="15" fill="#8B7355" stroke="#654321" stroke-width="2"/>
  <line x1="100" y1="420" x2="100" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="150" y1="420" x2="150" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="200" y1="420" x2="200" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="250" y1="420" x2="250" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="300" y1="420" x2="300" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="350" y1="420" x2="350" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="400" y1="420" x2="400" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="450" y1="420" x2="450" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="500" y1="420" x2="500" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="550" y1="420" x2="550" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="600" y1="420" x2="600" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="650" y1="420" x2="650" y2="450" stroke="#654321" stroke-width="2"/>
  <line x1="700" y1="420" x2="700" y2="450" stroke="#654321" stroke-width="2"/>

  <!-- Solar Panels on Balcony - Left Side -->
  <g transform="translate(120, 260) rotate(-20)">
    <!-- Panel frame -->
    <rect x="0" y="0" width="140" height="100" fill="#1a1a1a" stroke="#333333" stroke-width="3" rx="3"/>

    <!-- Solar cells - grid pattern -->
    <g fill="url(#panelDark)" stroke="#0a0a0a" stroke-width="0.5">
      <rect x="5" y="5" width="28" height="20"/>
      <rect x="35" y="5" width="28" height="20"/>
      <rect x="65" y="5" width="28" height="20"/>
      <rect x="95" y="5" width="28" height="20"/>

      <rect x="5" y="28" width="28" height="20"/>
      <rect x="35" y="28" width="28" height="20"/>
      <rect x="65" y="28" width="28" height="20"/>
      <rect x="95" y="28" width="28" height="20"/>

      <rect x="5" y="51" width="28" height="20"/>
      <rect x="35" y="51" width="28" height="20"/>
      <rect x="65" y="51" width="28" height="20"/>
      <rect x="95" y="51" width="28" height="20"/>

      <rect x="5" y="74" width="28" height="20"/>
      <rect x="35" y="74" width="28" height="20"/>
      <rect x="65" y="74" width="28" height="20"/>
      <rect x="95" y="74" width="28" height="20"/>
    </g>

    <!-- Glass glare -->
    <ellipse cx="70" cy="30" rx="50" ry="20" fill="#ffffff" opacity="0.08"/>

    <!-- Cables -->
    <path d="M 10 100 Q 5 115 0 125" stroke="#333333" stroke-width="2" fill="none"/>
    <path d="M 130 100 Q 135 115 140 125" stroke="#333333" stroke-width="2" fill="none"/>
  </g>

  <!-- Solar Panels on Balcony - Right Side -->
  <g transform="translate(540, 270) rotate(15)">
    <!-- Panel frame -->
    <rect x="0" y="0" width="140" height="100" fill="#1a1a1a" stroke="#333333" stroke-width="3" rx="3"/>

    <!-- Solar cells - grid pattern -->
    <g fill="url(#panelDark)" stroke="#0a0a0a" stroke-width="0.5">
      <rect x="5" y="5" width="28" height="20"/>
      <rect x="35" y="5" width="28" height="20"/>
      <rect x="65" y="5" width="28" height="20"/>
      <rect x="95" y="5" width="28" height="20"/>

      <rect x="5" y="28" width="28" height="20"/>
      <rect x="35" y="28" width="28" height="20"/>
      <rect x="65" y="28" width="28" height="20"/>
      <rect x="95" y="28" width="28" height="20"/>

      <rect x="5" y="51" width="28" height="20"/>
      <rect x="35" y="51" width="28" height="20"/>
      <rect x="65" y="51" width="28" height="20"/>
      <rect x="95" y="51" width="28" height="20"/>

      <rect x="5" y="74" width="28" height="20"/>
      <rect x="35" y="74" width="28" height="20"/>
      <rect x="65" y="74" width="28" height="20"/>
      <rect x="95" y="74" width="28" height="20"/>
    </g>

    <!-- Glass glare -->
    <ellipse cx="70" cy="30" rx="50" ry="20" fill="#ffffff" opacity="0.08"/>

    <!-- Cables -->
    <path d="M 10 100 Q 5 115 0 125" stroke="#333333" stroke-width="2" fill="none"/>
    <path d="M 130 100 Q 135 115 140 125" stroke="#333333" stroke-width="2" fill="none"/>
  </g>

  <!-- Ground -->
  <rect y="600" width="800" height="50" fill="#7CB342"/>
  <rect y="620" width="800" height="30" fill="#558B2F"/>

  <!-- Power indicator lines (energy flow) -->
  <g stroke="#FFD700" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,4">
    <line x1="160" y1="380" x2="200" y2="420"/>
    <line x1="620" y1="390" x2="600" y2="420"/>
  </g>
</svg>